  <div class="hr">
    <button id="bw" aria-label="Wishlist"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 20.5s-8-4.9-8-10.6A4.4 4.4 0 0 1 12 7a4.4 4.4 0 0 1 8 2.9c0 5.700-8 10.600-8 10.600z"/></svg><span id="wc">0</span></button>
    <button id="bc" aria-label="Keranjang"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><span id="cc">0</span></button>
  </div>
</header>
<div class="hero" id="hero"><div><h1 id="ht">NEW<br>COLLECTION</h1><a class="btn w" href="#all">Shop now</a></div></div>
<section id="all"><h2>ALL PRODUCTS</h2>
  <div class="filters">
    <select id="fc"></select><select id="fs"></select>
    <select id="fp"><option value="">price : all</option><option value="0-300000">&lt; Rp 300.000</option><option value="300000-500000">Rp 300.000 - 500.000</option><option value="500000-99999999">&gt; Rp 500.000</option></select>
    <select id="fa"><option value="">availability : all</option><option value="in">In stock</option><option value="out">Sold out</option></select>
    <select id="fo"><option value="f">sort : Featured</option><option value="n">sort : Newest</option><option value="pa">sort : Price low-high</option><option value="pd">sort : Price high-low</option></select>
  </div><div class="grid" id="g2"></div>
  <div id="rvw" style="display:none;margin-top:64px"><h2>RECENTLY VIEWED</h2><div class="grid" id="g3"></div></div></section>
<footer><h2>FIND US ON INSTAGRAM</h2><a id="ig" href="#">@raven</a><div class="fl" id="fl"></div></footer>

<div class="ov" id="ov"></div>
<aside class="drawer" id="dm"><div class="dh"><b class="bb" style="font-size:15px">MENU</b><button data-close>&times;</button></div>
  <div class="db menu"><a href="#" data-close>Home</a><a href="#all" data-close>All Products</a><a id="igm" href="#" target="_blank">Instagram</a><div class="th" id="th"><b class="bb">Tema</b><div><button data-th="minimal">Minimal</button><button data-th="neo">Neo-Brutalism</button></div></div></div></aside>
<aside class="drawer r" id="dw"><div class="dh"><b class="bb" style="font-size:15px">WISHLIST</b><button data-close>&times;</button></div>
  <div class="db" id="wl"></div></aside>
<aside class="drawer r" id="dc"><div class="dh"><b class="bb" style="font-size:15px">KERANJANG</b><button data-close>&times;</button></div>
  <div class="db" id="cl"></div>
  <div class="df"><div style="display:flex;justify-content:space-between;margin-bottom:12px"><span>Total</span><b id="ct">Rp 0</b></div>
    <input id="cn" placeholder="Nama penerima"><textarea id="ca" rows="2" placeholder="Alamat lengkap"></textarea>
    <button class="btn full" id="co">Checkout via WhatsApp</button></div></aside>
<div class="modal" id="pm"><div class="mb" id="pb"></div></div>

<script>
/* ===== KONFIGURASI: isi dengan repo GitHub kamu ===== */
const CFG={owner:'ravengetsuzo',repo:'raven-database',branch:'main',path:'data/store.json',
  logo:''}; // <- tempel URL logo di sini (atau isi lewat Admin > Pengaturan > Logo)
/* ==================================================== */
const DEMO={settings:{name:'Raven Get Suzo',wa:'6285702092051',instagram:'raven',hero:'',announcement:'Gratis ongkir min. belanja Rp 500.000',categories:['Hoodie','Shorts','Knitwear','Zip']},
products:[
{id:'d1',name:'Hoodie Raven - Relief Grey piping',price:675000,category:'Hoodie',sizes:['S','M','L','XL'],stock:10,images:[],featured:true,ts:4},
{id:'d2',name:'Short Sweatpants Raven - Dept',price:550000,category:'Shorts',sizes:['M','L','XL'],stock:6,images:[],featured:true,ts:3},
{id:'d3',name:'Knitwear Raven - Limbo',price:450000,category:'Knitwear',sizes:['M','L'],stock:0,images:[],featured:true,ts:2},
{id:'d4',name:'Zip Fitted Raven - Nord Black',price:649000,category:'Zip',sizes:['S','M','L'],stock:8,images:[],featured:true,limited:true,ts:1}]};
let S=DEMO.settings,P=DEMO.products,cart=JSON.parse(localStorage.getItem('rv_cart')||'[]'),sel={size:'',id:''};
let W=JSON.parse(localStorage.getItem('rv_wish')||'[]'),RV=JSON.parse(localStorage.getItem('rv_rv')||'[]');
const $=s=>document.querySelector(s),rp=n=>'Rp '+Number(n).toLocaleString('id-ID');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const img=p=>!p?'':/^(https?:|data:)/.test(p)?p:`https://raw.githubusercontent.com/${CFG.owner}/${CFG.repo}/${CFG.branch}/${p}`;
const F=k=>!S.feat||S.feat[k]!==false; /* fitur bisa dimatikan dari Admin > Pengaturan */
async function load(){
  try{const r=await fetch(`https://raw.githubusercontent.com/${CFG.owner}/${CFG.repo}/${CFG.branch}/${CFG.path}?t=${Math.floor(Date.now()/60000)}`);
    if(r.ok){const d=await r.json();S={...S,...d.settings};P=d.products||[];}}catch(e){}
  init();
}
function setLogo(){const L=S.logo||CFG.logo,im=L?`<img src="${esc(img(L))}" alt="${esc(S.name||'Raven')}">`:'';
  $('#logo').innerHTML=im||'RAVEN';$('#fl').innerHTML=im?`<div class="coin">${im}${im}</div>`:esc((S.name||'RAVEN GET SUZO').toUpperCase());}
/* ===== STOK: hanya lokal di browser pembeli (tidak ditulis ke GitHub / admin) ===== */
function applyStock(){
  const m=JSON.parse(localStorage.getItem('rv_sold')||'{}');
  P.forEach(p=>{const r=m[p.id];if(r&&r.base===p.s0)p.stock=Math.max(0,p.s0-r.sold)});
}
function reduceStock(items){
  const m=JSON.parse(localStorage.getItem('rv_sold')||'{}');
  items.forEach(c=>{const p=P.find(x=>x.id===c.id);if(!p)return;
    let r=m[c.id];if(!r||r.base!==p.s0)r={base:p.s0,sold:0};
    r.sold+=c.qty;m[c.id]=r;p.stock=Math.max(0,p.s0-r.sold)});
  localStorage.setItem('rv_sold',JSON.stringify(m));
}
/* ===== WISHLIST (lokal) ===== */
const heart=id=>F('wish')?`<button class="heart${W.includes(id)?' on':''}" data-w="${esc(id)}" aria-label="Wishlist"><svg viewBox="0 0 24 24"><path d="M12 20.5s-8-4.9-8-10.6A4.4 4.4 0 0 1 12 7a4.4 4.4 0 0 1 8 2.9c0 5.700-8 10.600-8 10.600z"/></svg></button>`:'';
function toggleWish(id){
  const i=W.indexOf(id);i>=0?W.splice(i,1):W.push(id);
  localStorage.setItem('rv_wish',JSON.stringify(W));
  render();rvUI();wishUI();
  document.querySelectorAll('#pb [data-w]').forEach(b=>b.classList.toggle('on',W.includes(b.dataset.w)));
}
function wishUI(){
  const l=W.map(id=>P.find(p=>p.id===id)).filter(Boolean);
  $('#wc').textContent=l.length;
  $('#wl').innerHTML=l.length?l.map(p=>`<div class="ci"><div class="ph">${p.images?.[0]?`<img src="${esc(img(p.images[0]))}">`:''}</div><div><b>${esc(p.name)}</b><br>${rp(p.price)}${p.stock<=0?' &middot; Sold out':''}
    <div style="margin-top:8px">${p.stock>0?`<button class="btn" style="padding:8px 14px;margin:0 10px 0 0" data-wo="${esc(p.id)}">Lihat</button>`:''}<button data-wx="${esc(p.id)}" style="background:none;border:0;color:#c00;font-size:13px;text-decoration:underline">Hapus</button></div></div></div>`).join(''):'<p class="empty">Wishlist kosong</p>';
}
$('#wl').onclick=e=>{const o=e.target.dataset.wo,x=e.target.dataset.wx;
  if(x)toggleWish(x);
  if(o){closeAll();showAll();product(o)}};
/* ===== RECENTLY VIEWED (lokal) ===== */
function addRV(id){RV=[id,...RV.filter(x=>x!==id)].slice(0,8);localStorage.setItem('rv_rv',JSON.stringify(RV))}
function rvUI(){
  const l=RV.map(id=>P.find(p=>p.id===id)).filter(Boolean).slice(0,4);
  $('#rvw').style.display=F('recent')&&l.length?'':'none';$('#g3').innerHTML=l.map(card).join('');
}
/* ===== SHARE ===== */
function share(p,m){
  const u=location.href.split('#')[0]+'#p='+encodeURIComponent(p.id),t=`${p.name} - ${rp(p.price)}`;
  if(m==='wa')return window.open('https://wa.me/?text='+encodeURIComponent(t+'\n'+u),'_blank');
  if(m==='n'&&navigator.share)return navigator.share({title:p.name,text:t,url:u}).catch(()=>{});
  (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>alert('Link produk disalin'),()=>prompt('Salin link produk:',u));
}
const showAll=()=>{$('#all').classList.add('show');$('#hero').style.display='none'};
/* ===== TEMA (Minimal / Neo-Brutalism) ===== */
function setTheme(t,save){if(t!=='minimal'&&t!=='neo')t='minimal';document.documentElement.dataset.theme=t;if(save)localStorage.setItem('rv_theme',t);document.querySelectorAll('#th [data-th]').forEach(b=>b.classList.toggle('on',b.dataset.th===t))}
function applyTheme(){const d=S.theme||'minimal',pick=S.themePick!==false;localStorage.setItem('rv_theme_def',d);$('#th').style.display=pick?'':'none';setTheme(pick?(localStorage.getItem('rv_theme')||d):d)}
$('#th').onclick=e=>{const b=e.target.closest('[data-th]');if(b)setTheme(b.dataset.th,true)};
function init(){
  applyTheme();
  P.forEach(p=>p.s0=p.stock);applyStock();
  document.title=S.name||'Raven';$('#ann').textContent=S.announcement||'';$('#ann').style.display=S.announcement?'':'none';
  if(S.hero)$('#hero').style.backgroundImage=`linear-gradient(#0003,#0006),url(${img(S.hero)})`;
  const ig=`https://instagram.com/${(S.instagram||'').replace('@','')}`;
  $('#ig').href=$('#igm').href=ig;$('#ig').textContent='@'+(S.instagram||'').replace('@','');setLogo();
  const cats=[...new Set([...(S.categories||[]),...P.map(p=>p.category)].filter(Boolean))],sizes=[...new Set(P.flatMap(p=>p.sizes||[]))];
  $('#fc').innerHTML='<option value="">category : all</option>'+cats.map(c=>`<option>${esc(c)}</option>`).join('');
  $('#fs').innerHTML='<option value="">size : all</option>'+sizes.map(c=>`<option>${esc(c)}</option>`).join('');
  $('#bw').style.display=F('wish')?'':'none';
  render();rvUI();wishUI();cartUI();
  const m=location.hash.match(/^#p=(.+)$/);if(m){showAll();product(decodeURIComponent(m[1]))}
}
const card=p=>`<div class="card${p.stock<=0?' so':''}" data-id="${esc(p.id)}"><div class="ph">${p.images?.[0]?`<img loading="lazy" src="${esc(img(p.images[0]))}" alt="${esc(p.name)}">`:esc(p.name)}${p.stock<=0?'<span class="tag">SOLD OUT</span>':''}${p.limited?'<span class="tag ltd">LIMITED EDITION</span>':''}${heart(p.id)}</div>
<h3>${esc(p.name)}</h3><p>${rp(p.price)}</p></div>`;
function render(){
  let l=[...P];const c=$('#fc').value,s=$('#fs').value,pr=$('#fp').value,a=$('#fa').value,o=$('#fo').value;
  if(c)l=l.filter(p=>p.category===c);if(s)l=l.filter(p=>(p.sizes||[]).includes(s));
  if(pr){const[x,y]=pr.split('-').map(Number);l=l.filter(p=>p.price>=x&&p.price<y)}
  if(a)l=l.filter(p=>a==='in'?p.stock>0:p.stock<=0);
  if(o==='n')l.sort((a,b)=>(b.ts||0)-(a.ts||0));if(o==='pa')l.sort((a,b)=>a.price-b.price);if(o==='pd')l.sort((a,b)=>b.price-a.price);
  if(o==='f')l.sort((a,b)=>!!b.featured-!!a.featured);
  $('#g2').innerHTML=l.length?l.map(card).join(''):'<p class="empty" style="grid-column:1/-1">Produk tidak ditemukan.</p>';
}
['fc','fs','fp','fa','fo'].forEach(i=>$('#'+i).onchange=render);
function openD(d){$('#ov').classList.add('on');$(d).classList.add('on')}
function closeAll(){document.querySelectorAll('.drawer,.ov,.modal').forEach(e=>e.classList.remove('on'))}
$('#bm').onclick=()=>openD('#dm');$('#bc').onclick=()=>{cartUI();openD('#dc')};$('#bw').onclick=()=>{wishUI();openD('#dw')};$('#ov').onclick=closeAll;
document.addEventListener('click',e=>{
  const hb=e.target.closest('.heart');if(hb){toggleWish(hb.dataset.w);return}
  if(e.target.closest('a[href="#all"]')){$('#all').classList.add('show');$('#hero').style.display='none';}
  if(e.target.closest('[data-close]'))closeAll();
  if(e.target===$('#pm'))closeAll();
  const c=e.target.closest('.card');if(c&&!c.classList.contains('so'))product(c.dataset.id);
});
function product(id){
  const p=P.find(x=>x.id===id);if(!p||p.stock<=0)return;sel={size:'',id};
  addRV(id);rvUI();
  const im=p.images||[];
  $('#pb').innerHTML=`<button class="x" data-close>&times;</button>
  <div><div class="ph" style="aspect-ratio:1/1.1">${im[0]?`<img id="mi" src="${esc(img(im[0]))}">`:esc(p.name)}${heart(p.id)}</div>
  ${im.length>1?`<div class="thumbs">${im.map((u,i)=>`<img class="${i?'':'on'}" src="${esc(img(u))}" data-t="${i}">`).join('')}</div>`:''}</div>
  <div class="mi">${p.limited?'<span class="tag" style="position:static;display:inline-block;margin-bottom:10px;background:#fff;color:#000;border:1px solid #000">LIMITED EDITION</span>':''}<h2>${esc(p.name)}</h2>
  <b>${rp(p.price)}</b><p style="color:#666;margin:14px 0;white-space:pre-line">${esc(p.desc||'')}</p>
  <div>Ukuran</div><div class="sz">${(p.sizes||[]).map(s=>`<button data-s="${esc(s)}">${esc(s)}</button>`).join('')}</div>
  <small style="color:#888">${p.stock>0?'Stok: '+p.stock:'Stok habis'}</small><br>
  <button class="btn full" id="add" ${p.stock<=0?'disabled':''}>${p.stock<=0?'Sold out':'Tambah ke keranjang'}</button>
  ${F('share')?`<div class="shr"><button data-sh="n">Bagikan</button><button data-sh="wa">WhatsApp</button><button data-sh="cp">Salin link</button></div>`:''}</div>`;
  $('#ov').classList.add('on');$('#pm').classList.add('on');
  $('#pb').onclick=e=>{
    const s=e.target.dataset.s,t=e.target.dataset.t,b=e.target.closest('button');
    if(s){sel.size=s;[...$('#pb').querySelectorAll('.sz button')].forEach(b=>b.classList.toggle('on',b.dataset.s===s))}
    if(t!=null){$('#mi').src=img(im[t]);[...e.target.parentNode.children].forEach(x=>x.classList.toggle('on',x===e.target))}
    if(b&&b.dataset.sh)share(p,b.dataset.sh);
    if(e.target.id==='add'){
      if(p.stock<=0)return;
      if((p.sizes||[]).length&&!sel.size)return alert('Pilih ukuran dulu');
      const k=cart.find(c=>c.id===id&&c.size===sel.size);k?k.qty=Math.min(k.qty+1,p.stock):cart.push({id,size:sel.size,qty:1});
      saveCart();closeAll();cartUI();openD('#dc');
    }
  };
}
const saveCart=()=>localStorage.setItem('rv_cart',JSON.stringify(cart));
function cartUI(){
  /* hapus item yang produknya sudah hilang / stok habis, dan batasi qty sesuai stok */
  cart=cart.filter(c=>{const p=P.find(x=>x.id===c.id);return p&&p.stock>0});
  cart.forEach(c=>{const p=P.find(x=>x.id===c.id);c.qty=Math.min(c.qty,p.stock)});
  saveCart();
  $('#cc').textContent=cart.reduce((a,c)=>a+c.qty,0);
  let t=0;$('#cl').innerHTML=cart.length?cart.map((c,i)=>{const p=P.find(x=>x.id===c.id);t+=p.price*c.qty;
    return `<div class="ci"><div class="ph">${p.images?.[0]?`<img src="${esc(img(p.images[0]))}">`:''}</div><div><b>${esc(p.name)}</b><br>${c.size?'Size '+esc(c.size)+' · ':''}${rp(p.price)}
    <div class="q" style="margin-top:8px"><button data-q="${i}" data-d="-1">-</button> ${c.qty} <button data-q="${i}" data-d="1">+</button></div>
    <button data-x="${i}" style="margin-top:8px;background:none;border:0;color:#c00;font-size:13px;text-decoration:underline">Hapus</button></div></div>`}).join(''):'<p class="empty">Keranjang kosong</p>';
  $('#ct').textContent=rp(t);
}
$('#cl').onclick=e=>{
  const x=e.target.dataset.x;if(x!=null){cart.splice(x,1);saveCart();cartUI();return}
  const i=e.target.dataset.q;if(i==null)return;const c=cart[i],p=P.find(x=>x.id===c.id);
  c.qty=Math.min(c.qty+Number(e.target.dataset.d),p.stock);if(c.qty<=0)cart.splice(i,1);saveCart();cartUI()};
$('#co').onclick=()=>{
  if(!cart.length)return;const n=$('#cn').value.trim(),a=$('#ca').value.trim();if(!n||!a)return alert('Isi nama dan alamat');
  let t=0,m=`Halo ${S.name||'Raven'}, saya mau order:\n\n`;
  cart.forEach(c=>{const p=P.find(x=>x.id===c.id);t+=p.price*c.qty;m+=`- ${p.name}${c.size?' ('+c.size+')':''} x${c.qty} = ${rp(p.price*c.qty)}\n`});
  m+=`\nTotal: ${rp(t)}\nNama: ${n}\nAlamat: ${a}`;
  window.open(`https://wa.me/${S.wa}?text=${encodeURIComponent(m)}`,'_blank');
  /* setelah checkout: kosongkan keranjang & form */
  const items=cart.map(c=>({id:c.id,qty:c.qty}));
  cart=[];saveCart();$('#cn').value='';$('#ca').value='';
  reduceStock(items);render();rvUI();wishUI();cartUI();closeAll();
};
load();
</script></body></html>
